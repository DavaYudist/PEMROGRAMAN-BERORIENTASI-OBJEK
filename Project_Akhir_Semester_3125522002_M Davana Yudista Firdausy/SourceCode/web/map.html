<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetSumenep Pro - Tactical Live GPS Telemetry Map</title>
    <!-- Asset lokal Leaflet offline -->
    <link rel="stylesheet" href="lib/leaflet.css" />
    <script src="lib/leaflet.js"></script>
    <style>
        :root {
            --bg-dark: #0b1120;
            --card-dark: #1e293b;
            --border-dark: #334155;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: var(--bg-dark); 
            color: #f1f5f9; 
            display: flex;
            flex-direction: column;
        }
        
        /* CSS Overrides to prevent tile tearing, overlapping, and stacking glitches in JavaFX WebView */
        .leaflet-tile-container img {
            transform: none !important;
            image-rendering: auto;
        }
        .leaflet-zoom-animated {
            transform: none !important;
        }

        /* 1. TOP OPERATIONAL STATUS BAR */
        .operational-header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid var(--border-dark);
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 1000;
            flex-shrink: 0;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .beacon-pulse {
            width: 10px;
            height: 10px;
            background: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.15); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .brand-title {
            font-size: 14.5px;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .rating-badge {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #fbbf24;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 5px;
        }

        /* Telemetry Pills */
        .telemetry-pills {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .telemetry-pill {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-dark);
            border-radius: 6px;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        /* Filter & Map Controls */
        .map-actions {
            display: flex;
            gap: 6px;
        }
        .btn-mini {
            background: #0f172a;
            border: 1px solid var(--border-dark);
            color: var(--text-light);
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-mini:hover {
            border-color: var(--accent-blue);
            color: #ffffff;
        }
        .btn-mini.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #ffffff;
        }

        /* 2. MAIN LAYOUT (MAP + SIDEBAR) */
        #main-container { 
            display: flex; 
            flex: 1; 
            width: 100%;
            height: calc(100% - 46px);
            position: relative;
            overflow: hidden;
        }
        #map { 
            flex: 3; 
            width: 100%; 
            height: 100%; 
            background: #0f172a;
            position: relative;
        }
        #sidebar { 
            flex: 1; 
            min-width: 320px;
            max-width: 360px;
            height: 100%;
            padding: 12px; 
            background: #0f172a; 
            border-left: 1px solid var(--border-dark);
            overflow-y: auto; 
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 70px;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-dark);
            margin-bottom: 4px;
        }
        .sidebar-header h2 {
            font-size: 12.5px;
            font-weight: 800;
            margin: 0;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Card Kendaraan di Sidebar */
        .car-card { 
            background: var(--card-dark); 
            padding: 10px 12px; 
            border-radius: 8px; 
            border: 1px solid var(--border-dark); 
            border-left: 4px solid var(--accent-blue); 
            box-shadow: 0 2px 6px rgba(0,0,0,0.3); 
            transition: transform 0.15s, border-color 0.15s;
            cursor: pointer;
        }
        .car-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-green);
        }
        .car-card.vip { 
            border-left-color: var(--accent-amber); 
        }
        .car-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .car-plat {
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
        }
        .pill-category {
            font-size: 9px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .pill-reguler { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .pill-vip { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        
        .car-detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 10.5px;
            color: var(--text-muted);
            margin: 2px 0;
        }
        .car-detail-row strong {
            color: #ffffff;
        }

        /* Mini Battery Bar */
        .battery-bar-container {
            width: 100%;
            height: 3px;
            background: #334155;
            border-radius: 2px;
            overflow: hidden;
            margin: 4px 0 2px 0;
        }
        .battery-bar-fill {
            height: 100%;
            background: var(--accent-green);
            border-radius: 2px;
        }
        .battery-bar-fill.vip {
            background: var(--accent-amber);
        }

        /* 3. BOTTOM / LATERAL DOCK NAVIGATION */
        .dock-container {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-dark);
            border-radius: 30px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 9999;
        }
        .dock-item {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dock-item:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }
        .dock-item.active {
            background: var(--accent-green);
            color: #ffffff;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }
        .dock-badge {
            background: #ef4444;
            color: white;
            font-size: 9px;
            font-weight: 800;
            padding: 1px 5px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- 1. TOP OPERATIONAL STATUS BAR -->
    <div class="operational-header">
        <div class="brand-section">
            <div class="beacon-pulse"></div>
            <div>
                <h1 class="brand-title">FleetSumenep Pro • Operations Center</h1>
                <span class="rating-badge">★ 5.0 Garasi Utama Sumenep</span>
            </div>
        </div>

        <div class="telemetry-pills">
            <div class="telemetry-pill">
                <span style="color:#34d399;">●</span>
                <span id="pill-onroad-count">2 Unit On-Road</span>
            </div>
            <div class="telemetry-pill">
                <span style="color:#60a5fa;">📍</span>
                <span>Pusat: -7.015, 113.860</span>
            </div>
        </div>

        <div class="map-actions">
            <button class="btn-mini" onclick="resetMapView()">🎯 Pusatkan Peta</button>
            <button class="btn-mini active" id="flt-all" onclick="filterCategory('ALL')">Semua</button>
            <button class="btn-mini" id="flt-reg" onclick="filterCategory('Reguler')">Reguler</button>
            <button class="btn-mini" id="flt-vip" onclick="filterCategory('VIP')">VIP</button>
        </div>
    </div>

    <!-- 2. MAIN MAP CONTAINER -->
    <div id="main-container">
        <div id="map"></div>
        <div id="sidebar">
            <div class="sidebar-header">
                <h2>Armada Aktif di Jalan</h2>
                <span id="unit-count-badge" style="font-size: 11px; font-weight: 800; color: #60a5fa;">0 Unit</span>
            </div>
            <div id="fleet-list">
                <div style="font-size: 11px; color: #94a3b8; text-align: center; padding: 20px;">
                    Menghubungkan ke Domain Model Java...
                </div>
            </div>
        </div>
    </div>

    <!-- 3. BOTTOM / LATERAL DOCK NAVIGATION -->
    <div class="dock-container">
        <button class="dock-item" onclick="switchTabInApp(2)">
            📋 Pesanan & Billing <span class="dock-badge" id="dock-badge-orders">2</span>
        </button>
        <button class="dock-item" onclick="switchTabInApp(1)">
            📅 Jadwal 7-Hari
        </button>
        <button class="dock-item" onclick="switchTabInApp(1)">
            🚗 Armada & Garasi
        </button>
        <button class="dock-item active">
            📍 GPS Telemetry
        </button>
        <button class="dock-item" onclick="switchTabInApp(2)">
            💼 File P12 & DB
        </button>
    </div>

    <script>
        // 1. Force Leaflet to run in 2D software rendering mode before initializing map
        L.Browser.any3d = false;

        // 2. Inisialisasi Peta Leaflet berpusat di Sumenep
        const sumenepCenter = [-7.015, 113.860];
        const map = L.map('map', {
            zoomControl: true,
            attributionControl: true,
            zoomAnimation: false,
            fadeAnimation: false,
            markerZoomAnimation: false,
            inertia: false,
            preferCanvas: true
        }).setView(sumenepCenter, 14);

        // 3. Tile Layer Esri World Street Map
        const tileLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // Auto retry tile
        tileLayer.on('tileerror', function(error, tile) {
            setTimeout(() => { 
                if (tile && tile.src) tile.src = tile.src; 
            }, 1000);
        });

        setTimeout(() => {
            if (map) map.invalidateSize();
        }, 300);

        window.triggerMapResize = function() {
            if (map) map.invalidateSize();
        };

        window.addEventListener('resize', () => {
            if (map) map.invalidateSize();
        });

        let markers = {};
        let currentCars = [];
        let activeFilter = 'ALL';

        function switchTabInApp(tabIndex) {
            if (window.javaBridge && typeof window.javaBridge.switchTab === 'function') {
                window.javaBridge.switchTab(tabIndex);
            }
        }

        function getCarSvg(kategori) {
            const isVIP = (kategori === 'VIP');
            const color = isVIP ? '#f59e0b' : '#3b82f6';
            const iconBadge = isVIP ? '👑' : '🚗';
            
            return `
            <div style="background: ${color}; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2.5px solid #ffffff; box-shadow: 0 4px 8px rgba(0,0,0,0.5); font-size: 16px;">
                ${iconBadge}
            </div>`;
        }

        function resetMapView() {
            if (map) map.setView(sumenepCenter, 14);
        }

        function focusCar(lat, lng) {
            if (map && lat && lng) {
                map.setView([lat, lng], 16);
            }
        }

        function filterCategory(cat) {
            activeFilter = cat;
            document.getElementById('flt-all').classList.toggle('active', cat === 'ALL');
            document.getElementById('flt-reg').classList.toggle('active', cat === 'Reguler');
            document.getElementById('flt-vip').classList.toggle('active', cat === 'VIP');
            renderFleet(currentCars);
        }

        function updateFleetData(data) {
            if (!data) return;
            currentCars = data;
            renderFleet(data);
        }

        function renderFleet(cars) {
            const fleetList = document.getElementById('fleet-list');
            fleetList.innerHTML = '';

            const activeCars = cars.filter(c => (c.disewa === true || c.status === 'DISEWA'));
            
            document.getElementById('unit-count-badge').textContent = `${activeCars.length} Unit On-Road`;
            document.getElementById('pill-onroad-count').textContent = `${activeCars.length} Unit On-Road`;
            document.getElementById('dock-badge-orders').textContent = activeCars.length;

            const existingPlates = new Set();

            activeCars.forEach(car => {
                const isVIP = (car.kategori === 'VIP');
                if (activeFilter === 'Reguler' && isVIP) return;
                if (activeFilter === 'VIP' && !isVIP) return;

                existingPlates.add(car.plat);

                // Update / Add Marker
                const customIcon = L.divIcon({
                    className: 'svg-marker',
                    html: getCarSvg(car.kategori),
                    iconSize: [34, 34],
                    iconAnchor: [17, 17],
                    popupAnchor: [0, -17]
                });

                const popupContent = `
                    <div style="font-family: inherit; font-size: 11px; color: #0f172a; padding: 4px;">
                        <strong style="font-size: 12px; color: #1e293b;">${car.plat} - ${car.merk}</strong><br/>
                        <span style="font-size: 10px; color: ${isVIP ? '#b45309' : '#15803d'}; font-weight: bold;">[${car.kategori}]</span><br/>
                        <strong>Penyewa:</strong> ${car.penyewa || '-'}<br/>
                        <strong>Baterai Telemetri:</strong> ${car.baterai || 90}%<br/>
                        <strong>Koordinat:</strong> ${car.lat ? car.lat.toFixed(5) : '-'}, ${car.lng ? car.lng.toFixed(5) : '-'}
                    </div>
                `;

                if (markers[car.plat]) {
                    markers[car.plat].setLatLng([car.lat, car.lng]);
                    markers[car.plat].setIcon(customIcon);
                    markers[car.plat].setPopupContent(popupContent);
                } else {
                    const marker = L.marker([car.lat, car.lng], { icon: customIcon }).addTo(map);
                    marker.bindPopup(popupContent);
                    markers[car.plat] = marker;
                }

                // Render Sidebar Card
                const card = document.createElement('div');
                card.className = `car-card ${isVIP ? 'vip' : ''}`;
                card.onclick = () => focusCar(car.lat, car.lng);

                const batteryPercent = car.baterai || 90;

                card.innerHTML = `
                    <div class="car-card-header">
                        <span class="car-plat">${car.plat}</span>
                        <span class="pill-category ${isVIP ? 'pill-vip' : 'pill-reguler'}">${car.kategori}</span>
                    </div>
                    <div class="car-detail-row">
                        <span>Model:</span>
                        <strong>${car.merk}</strong>
                    </div>
                    <div class="car-detail-row">
                        <span>Penyewa:</span>
                        <strong style="color: #60a5fa;">${car.penyewa || '-'}</strong>
                    </div>
                    <div class="car-detail-row">
                        <span>Baterai GPS:</span>
                        <strong>${batteryPercent}%</strong>
                    </div>
                    <div class="battery-bar-container">
                        <div class="battery-bar-fill ${isVIP ? 'vip' : ''}" style="width: ${batteryPercent}%;"></div>
                    </div>
                    <div class="car-detail-row" style="margin-top: 4px; font-size: 9.5px;">
                        <span>Lokasi:</span>
                        <span>${car.lat.toFixed(4)}, ${car.lng.toFixed(4)}</span>
                    </div>
                `;
                fleetList.appendChild(card);
            });

            // Cleanup removed markers
            for (let plat in markers) {
                if (!existingPlates.has(plat)) {
                    map.removeLayer(markers[plat]);
                    delete markers[plat];
                }
            }
        }
    </script>
</body>
</html>
